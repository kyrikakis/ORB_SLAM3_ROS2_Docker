%YAML:1.0

#--------------------------------------------------------------------------------------------
# System config
#--------------------------------------------------------------------------------------------

# When the variables are commented, the system doesn't load a previous session or not store the current one

# If the LoadFile doesn't exist, the system give a message and create a new Atlas from scratch
#System.LoadAtlasFromFile: "Session_MH01_MH02_MH03_Stereo60_Pseudo"

# The store file is created from the current session, if a file with the same name exists it is deleted
#System.SaveAtlasToFile: "Session_MH01_MH02_MH03_Stereo60_Pseudo"

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------

Camera.type: "PinHole"

# Left Camera calibration and distortion parameters (OpenCV)
Camera.fx: 732.594427
Camera.cx: 466.611704
Camera.fy: 731.768499
Camera.cy: 288.668877

# Left Camera distortion parameters
Camera.k1: -0.094399
Camera.k2: -0.011658
Camera.p1: 0.000754
Camera.p2: -0.000034
Camera.k3: 0.000000

Camera.width: 1024
Camera.height: 576

# Right Camera calibration and distortion parameters (OpenCV)
Camera2.fx: 732.504207
Camera2.cx: 486.045297
Camera2.fy: 731.438683
Camera2.cy: 255.853900

# Right Camera distortion parameters
Camera2.k1: -0.088954
Camera2.k2: -0.024083
Camera2.p1: 0.000642
Camera2.p2: -0.000169
Camera2.k3: 0.000000

Camera2.width: 1024
Camera2.height: 576

# Camera frames per second 
Camera.fps: 30.0

# stereo baseline in meters times fx
Camera.bf: 58.6032

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
ThDepth: 35.0 #45.0 60.0

#--------------------------------------------------------------------------------------------
# Stereo Rectification. Only if you need to pre-rectify the images.
# Camera.fx, .fy, etc must be the same as in LEFT.P
#--------------------------------------------------------------------------------------------
LEFT.height: 576
LEFT.width: 1024
