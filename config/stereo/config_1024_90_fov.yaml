LEFT.K: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [732.5944271099735, 0.0, 466.6117039176741, 0.0, 731.7684989792251, 288.66887659743736, 0.0, 0.0, 1.0]
